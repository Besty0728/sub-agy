[project]
name = "sub-agy"
version = "0.1.1"
description = "sub-agy: async code execution backend for Claude Code / Codex, powered by Antigravity CLI (agy)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sub-agy = "sub_agy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/sub_agy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
